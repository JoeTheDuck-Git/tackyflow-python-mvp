[project]
name = "content-workflow-python"
version = "0.1.0"
description = "Platform-neutral Python backend for the TackyFlow content workflow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "google-genai>=1.0,<3.0",
  "httpx>=0.28,<1.0",
  "openai>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "psycopg-pool>=3.2,<4.0",
  "pydantic>=2.10,<3.0",
  "python-dotenv>=1.0,<2.0",
  "uvicorn[standard]>=0.34,<1.0",
  "llama-index-core>=0.14,<1.0",
  "llama-index-embeddings-openai>=0.5,<1.0",
  "llama-index-vector-stores-postgres>=0.7,<1.0",
  "langgraph>=1.0,<2.0",
  "pgvector>=0.4,<1.0",
  "pypdf>=5.0,<7.0",
]

[project.optional-dependencies]
crawler = ["crawl4ai>=0.7,<1.0"]

[dependency-groups]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.vercel]
entrypoint = "app.main:app"
